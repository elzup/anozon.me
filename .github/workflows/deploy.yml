# .github/workflows/deploy.yml
# ここで build して dist を Cloudflare Workers (static assets) へ上げる。PR ではテストとビルドだけ行う
name: Build and Deploy to Cloudflare Workers
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # astro build と vitest を実行するのは bun ではなく Node なので、
      # runner のプリインストール版に任せず明示的に固定する
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # `bun test` は bun 内蔵ランナーを起動してしまうので run 経由で vitest を呼ぶ
      - run: bun run test
      - run: bun run build

      # 本番 (anozon.me / www の Custom Domain) は main だけ。設定は wrangler.toml
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        timeout-minutes: 5
